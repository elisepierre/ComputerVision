<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Future Academy - Welcome</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .menu-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            width: 250px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .card h2 {
            margin: 10px 0;
            font-size: 1.5rem;
        }

        .card p {
            font-size: 0.9rem;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <h1>ASL Future Academy</h1>
    <p>Select your learning path</p>

    <div class="menu-container">
        <!-- Alphabet Module -->
        <a href="alphabet.html" class="card">
            <div class="icon">🔤</div>
            <h2>Alphabet</h2>
            <p>Master the A-Z signs</p>
        </a>

        <!-- Greetings Module -->
        <a href="greetings.html" class="card">
            <div class="icon">🤝</div>
            <h2>Meetings</h2>
            <p>Basic social interactions</p>
        </a>

        <!-- Restaurant Module -->
        <a href="order.html" class="card">
            <div class="icon">🍱</div>
            <h2>Ordering</h2>
            <p>Food, drinks & prices</p>
        </a>
    </div>

</body>
</html>
