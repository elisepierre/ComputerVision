<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Future Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">ASL <span class="highlight">Future</span></div>
            <div class="score-pill">Score <span id="score">0</span></div>
        </header>

        <main>
            <div class="video-frame">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output_canvas"></canvas>
                <div id="feedback-pop" class="success-toast">NICE! ✨</div>
            </div>

            <div class="learning-panel">
                <div class="card current-target">
                    <p class="label">Current Challenge</p>
                    <h2 id="target-word">GOODBYE</h2>
                </div>
                
                <div class="card hint-card">
                    <p>💡 <span class="hint-title">Tips:</span> Open your hand completely. Your palm must face the camera!</p>
                </div>

                <button id="enableWebcamButton">Start Analysis</button>
                <p id="status-bar" class="status-text">AI is booting up...</p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs" type="module"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
