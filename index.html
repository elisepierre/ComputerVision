<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Learning Space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">ASL <span>Academy</span></div>
            <div class="score-pill">Points: <span id="score">0</span></div>
        </header>

        <main>
            <div class="video-frame">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output_canvas"></canvas>
                <div id="feedback-pop" class="success-toast">Great Job! ✨</div>
            </div>

            <div class="learning-card">
                <div class="instruction">
                    <p>Current Challenge</p>
                    <h2 id="target-word">GOODBYE</h2>
                </div>
                
                <div class="hint">
                    <p>💡 <span>Pro Tip:</span> Keep your palm flat and show all 5 fingers to the camera!</p>
                </div>

                <button id="enableWebcamButton">Start Lesson</button>
                <p id="status-bar">AI is preparing your classroom...</p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs" type="module"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
