<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Trainer Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>ASL <span class="highlight">Coach</span></h1>
            <div class="score-display">Score: <span id="score">0</span></div>
        </header>

        <div class="main-section">
            <div class="video-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output_canvas"></canvas>
                <div class="feedback-overlay" id="feedback-pop">EXCELLENT!</div>
            </div>

            <div class="control-panel">
                <div class="target-card">
                    <p class="label">Show me:</p>
                    <h2 class="word" id="target-word">GOODBYE</h2>
                </div>
                <button id="enableWebcamButton">START ANALYSIS</button>
                <p id="status-bar" class="status-text">Waiting for AI...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs" type="module"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
