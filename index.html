<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Future Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">ASL <span class="highlight">Future</span></div>
            <div class="header-right">
                <!-- Bouton Settings intégré proprement -->
                <button id="open-settings" class="icon-btn">⚙️</button>
                <div class="score-pill">Score <span id="score">0</span></div>
            </div>
        </header>

        <main>
            <div class="video-frame">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output_canvas"></canvas>
                <div id="feedback-pop" class="success-toast">NICE! ✨</div>
            </div>

            <div class="learning-panel">
                <div class="card current-target">
                    <div class="target-header">
                        <p class="label">Current Challenge</p>
                        <button id="help-btn" class="help-circle">?</button>
                    </div>
                    <h2 id="target-word">GOODBYE</h2>
                </div>

                <div class="card hint-card">
                    <p>💡 <span class="hint-title">Tips:</span> Open your hand completely. Your palm must face the camera!</p>
                </div>

                <button id="enableWebcamButton">Start Analysis</button>
                <p id="status-bar" class="status-text">AI is booting up...</p>
            </div>
        </main>
    </div>

    <!-- MODAL SETTINGS -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>AI Configuration</h3>
            <p>Enter your Gemini API Key:</p>
            <input type="password" id="api-key-input" placeholder="AI Key...">
            <div class="modal-buttons">
                <button id="save-settings" class="btn-primary">Save & Refresh</button>
                <button id="close-settings" class="btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <!-- MODAL HELP -->
    <div id="help-modal" class="modal-overlay">
        <div class="modal-content help-border">
            <span class="close-help">&times;</span>
            <h3 id="help-title">AI Tutor</h3>
            <p id="help-text">Consulting Gemini...</p>
            <div class="ai-badge">Gemini LLM ✨</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@google/generative-ai@0.1.0/dist/index.min.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs" type="module"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
