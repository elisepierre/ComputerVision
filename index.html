<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Future Academy - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-blue: #162447;
            --electric-violet: #8a2be2;
            --bg-beige: #fdfaf5;
            --text-dark: #1b1b2f;
            --white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--main-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 95%;
            max-width: 1050px;
            background: var(--bg-beige);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
            text-align: center;
        }

        .logo { font-size: 2.5rem; font-weight: 800; color: var(--main-blue); margin-bottom: 5px; }
        .logo .highlight { color: var(--electric-violet); }
        .subtitle { color: var(--text-dark); opacity: 0.7; margin-bottom: 40px; font-size: 1.1rem; }

        /* Grille des modules */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            justify-content: center;
        }

        .module-card {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-dark);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 4px solid var(--white); /* Pour la cohérence avec le cadre caméra */
            display: block;
        }

        .module-card:hover {
            transform: translateY(-10px);
            border-color: var(--electric-violet);
            box-shadow: 0 15px 30px rgba(138, 43, 226, 0.2);
        }

        /* Cadre photo avec le même ratio 4:3 que ta caméra */
        .image-container {
            width: 100%;
            aspect-ratio: 4/3; 
            overflow: hidden;
            background: #000; /* Fond noir comme la vidéo en chargement */
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card-content { 
            padding: 20px; 
            background: var(--bg-beige); /* Fond beige pour la partie texte interne */
        }
        
        .card-content h2 { margin: 0 0 10px 0; font-size: 1.4rem; color: var(--main-blue); }
        .card-content p { margin: 0; font-size: 0.9rem; opacity: 0.8; line-height: 1.4; }

        @media (max-width: 600px) { .modules-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo">ASL <span class="highlight">Future</span> Academy</div>
        <p class="subtitle">Select a module to start practicing with AI</p>

        <div class="modules-grid">
            <a href="alphabet.html" style="text-decoration: none;">
                <div class="module-card">
                    <div class="image-container">
                        <img src="images/alphabet_preview.jpg" alt="Alphabet Module">
                    </div>
                    <div class="card-content">
                        <h2>Alphabet</h2>
                        <p>Master finger-spelling (A-Z) with real-time AI validation.</p>
                    </div>
                </div>
            </a>

            <a href="greetings.html" style="text-decoration: none;">
                <div class="module-card">
                    <div class="image-container">
                        <img src="images/meetings_preview.jpg" alt="Meetings Module">
                    </div>
                    <div class="card-content">
                        <h2>Meetings</h2>
                        <p>Social interactions: Greetings and basic introductions.</p>
                    </div>
                </div>
            </a>

            <a href="order.html" style="text-decoration: none;">
                <div class="module-card">
                    <div class="image-container">
                        <img src="images/ordering_preview.jpg" alt="Ordering Module">
                    </div>
                    <div class="card-content">
                        <h2>Ordering</h2>
                        <p>Daily life: Prices and ordering food in local shops.</p>
                    </div>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
